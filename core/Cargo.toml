[workspace]
resolver = "2"
members = ["mrtv-core", "mrtv-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/mrtungdev/mrtv"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.bench]
debug = false
