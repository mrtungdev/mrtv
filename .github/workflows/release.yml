name: Phát hành

# Đẩy một tag "v0.1.0" là workflow tự đóng gói và tạo BẢN NHÁP trên GitHub Releases.
# Thiếu bí mật nào thì bước tương ứng bị bỏ qua (bản ký tạm). Bản dựng ở đây không bật tự cập nhật:
# khoá EdDSA của Sparkle chỉ nằm trên máy người giữ dự án. Tag đã có bản phát hành (tạo từ máy bằng
# make release PUBLISH=1) thì workflow chỉ đóng gói để kiểm tra. Xem docs/RELEASING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      P12: ${{ secrets.DEVELOPER_ID_P12 }}
      P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Công cụ
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup component add clippy rustfmt

      - name: Chứng chỉ Developer ID
        if: env.P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Hồ sơ công chứng
        if: env.APPLE_ID != ''
        run: xcrun notarytool store-credentials mrtv-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Đóng gói
        run: |
          if [ -n "$APPLE_ID" ]; then export NOTARY_PROFILE=mrtv-notary; fi
          scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Tạo bản nháp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh release list --json tagName --jq ".[] | select(.tagName == \"$GITHUB_REF_NAME\") | .tagName")" ]; then
            echo "Tag $GITHUB_REF_NAME đã có bản phát hành (tạo từ máy), bỏ qua."
            exit 0
          fi
          V="${GITHUB_REF_NAME#v}"
          D="dist/$V"
          gh release create "$GITHUB_REF_NAME" "$D/MrTV-$V.dmg" "$D/MrTV-$V.zip" "$D/SHA256SUMS.txt" \
            --draft --title "Mr TV $V" --notes-file "$D/RELEASE_NOTES.md"
